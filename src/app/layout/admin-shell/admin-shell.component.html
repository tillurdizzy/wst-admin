<div class="shell">
  <header class="banner">Westbury Square Townhomes Manager’s Dashboard</header>

  <div class="body">
    <aside class="menu">
      <div class="menu-title">Menu</div>
      <nav>
        <a routerLink="/owners" routerLinkActive="active">Owners</a>
        <a routerLink="/units" routerLinkActive="active">Units</a>
        <a routerLink="/parking" routerLinkActive="active">Parking</a>
        <a routerLink="/help" routerLinkActive="active">Help</a>
      </nav>
      <p-button
        label="Log out"
        icon="pi pi-sign-out"
        severity="secondary"
        [outlined]="true"
        styleClass="logout-btn"
        (onClick)="logout()"
      />
    </aside>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
